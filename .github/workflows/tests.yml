name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax
        run: python -m py_compile vex_shadow_audit.py tests/test_audit.py tests/test_regressions.py
      - name: Run synthetic tests as an unprivileged user
        run: python -m unittest discover -s tests -v
      - name: Run documented example
        run: |
          python vex_shadow_audit.py --repo high=examples/repo_high --repo low=examples/repo_low --findings examples/findings.json --json-out report.json --markdown-out report.md
          python -c 'import json; from pathlib import Path; r = json.loads(Path("report.json").read_text()); assert r["summary"] == {"silent_shadow": 1, "status_conflict_review": 1}; assert r["findings_checked"] == 3'
